	{# APK 관리 오른쪽 메뉴: ☰ 버튼을 누르면 아래로 펼쳐짐 #}
	<div class="nav-more">
		<button type="button" class="nav-more-btn" aria-expanded="false" aria-haspopup="true" title="메뉴 더보기"><span class="icon">☰</span><span class="nav-label">메뉴</span></button>
		<div class="nav-more-panel">
			<a>등록없지</a>
		</div>

<script>
// 펼침 메뉴: 버튼 클릭 → 열기/닫기, 바깥 클릭·ESC → 닫기
(function () {
	const box = document.querySelector('.nav-more');
	if (!box) return;
	const btn = box.querySelector('.nav-more-btn');
	const setOpen = (open) => { box.classList.toggle('open', open); btn.setAttribute('aria-expanded', open); };
	btn.addEventListener('click', (e) => { e.stopPropagation(); setOpen(!box.classList.contains('open')); });
	document.addEventListener('click', (e) => { if (!box.contains(e.target)) setOpen(false); });
	document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
})();
</script>
